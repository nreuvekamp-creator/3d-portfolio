<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>De ideeëndoos — Niels Reuvekamp</title>
<meta name="description" content="Een kijkje in de ideeëndoos van Niels Reuvekamp: elk idee kwam ergens vandaan, en elk idee heeft een plek op de wereld.">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.9.0/dist/maplibre-gl.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="intro.css">
<link rel="stylesheet" href="globe.css">
<link rel="stylesheet" href="zaal.css">
</head>
<body>

<!-- ============ de bol, ligt er vanaf het begin onder ============ -->
<div id="map"></div>

<div id="bar" hidden>
  <div class="brand"><span class="label">de ideeëndoos van</span><strong>Niels Reuvekamp</strong></div>
</div>

<!-- Linksonder: een map met een opschrift dat je niet hoort te lezen. -->
<div id="mappen" hidden>
  <div class="dossier">
    <button class="tab-confidential" id="tabGeheim" aria-pressed="false">
      <span class="stempel">Confidential</span>
    </button>
    <p class="fluister hand" id="fluister">als je me echt wil stalken, klik hier</p>
  </div>
  <p class="count label" id="count"></p>
</div>

<aside id="panel" aria-live="polite">
  <button class="close" id="closeBtn" aria-label="Sluiten">&times;</button>
  <div class="p-photo" id="pPhoto"></div>
  <div class="p-body">
    <p class="p-meta label" id="pMeta"></p>
    <h2 id="pTitle"></h2>
    <p class="p-where" id="pWhere"></p>
    <p class="p-sum" id="pSum"></p>
    <div class="p-text" id="pText"></div>
    <div class="p-tags" id="pTags"></div>
    <div class="todo" id="pTodo" hidden></div>
  </div>
</aside>

<!-- ============ het verhaal ============ -->
<div id="intro" aria-label="Introductie">

  <div class="void cmyk"></div>

  <!-- jij in de leegte -->
  <figure class="me" id="me"><img id="meImg" alt=""></figure>

  <!-- de zwevende tekst -->
  <div class="lines" id="lines" aria-live="polite"></div>

  <!-- drie voorbeelden vliegen langs -->
  <div class="examples" id="examples"></div>

  <!-- de kist, achterin -->
  <button class="chest" id="chest" aria-label="Open de doos en ga naar de wereld">
    <div class="glow"></div>
    <svg viewBox="0 0 200 152" class="box" aria-hidden="true">
      <defs>
        <linearGradient id="hout" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#9a7748"/><stop offset="1" stop-color="#5e4529"/>
        </linearGradient>
      </defs>
      <g class="deksel">
        <path d="M20 76 Q100 14 180 76 Z" fill="url(#hout)" stroke="#3d2c1a" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M20 76 Q100 26 180 76" fill="none" stroke="#3d2c1a" stroke-width="1.4" opacity=".45"/>
      </g>
      <g class="bak">
        <path d="M20 74 L180 74 L172 140 L28 140 Z" fill="url(#hout)" stroke="#3d2c1a" stroke-width="2.5" stroke-linejoin="round"/>
        <rect x="92" y="90" width="16" height="21" rx="2" fill="#c9962c" stroke="#3d2c1a" stroke-width="2"/>
      </g>
    </svg>
    <span class="chest-cue label">open de doos</span>
  </button>

  <!-- wat er uit de kist komt -->
  <div class="envelopes" id="envelopes" aria-hidden="true"></div>

  <!-- overslaan -->
  <div class="skip">
    <button class="stamp-btn skip-btn" id="skipBtn">Sla over</button>
    <p class="skip-hint label">of houd de spatiebalk vast</p>
    <svg class="skip-ring" id="skipRing" viewBox="0 0 44 44" aria-hidden="true">
      <circle class="track" cx="22" cy="22" r="19"/>
      <circle class="fill" cx="22" cy="22" r="19"/>
    </svg>
  </div>
</div>

<!-- ============ over alles heen ============ -->
<div id="fidget"></div>
<div class="paper-grain"></div>
<div class="vignette"></div>

<div id="err" hidden></div>

<script src="https://unpkg.com/maplibre-gl@5.9.0/dist/maplibre-gl.js"></script>
<script src="fidget.js"></script>
<script src="globe.js"></script>
<script src="zaal.js"></script>
<script src="intro.js"></script>
<script>
/* Opstarten: eerst de gegevens, dan de bol klaarzetten, dan het verhaal. */
fetch("trips.json", {cache: "no-store"})
  .then(function(r){ if (!r.ok) throw new Error("trips.json: " + r.status); return r.json(); })
  .then(function(data){
    Globe.init(data);
    if (window.Zaal) Zaal.init(data);
    Fidget.start();
    Intro.start(data, function(){
      Globe.reveal();
      Fidget.kalmeer();
    });
  })
  .catch(function(e){
    var el = document.getElementById("err");
    el.textContent = "Kon de gegevens niet laden. " + e.message +
      "  Open deze pagina via een webserver, niet als bestand.";
    el.hidden = false;
  });
</script>
</body>
</html>
